  <style>
    /* Strictly prevent horizontal scrolling universally */
    html, body { 
      scroll-behavior: smooth; 
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-10deg) rotateX(5deg); }
      50% { transform: translateY(-20px) rotate(-9deg) rotateX(10deg); }
    }
    @keyframes float-delayed {
      0%, 100% { transform: translateY(0) rotateY(15deg) translateZ(50px); }
      50% { transform: translateY(-15px) rotateY(12deg) translateZ(60px); }
    }
    @keyframes float-fast {
      0%, 100% { transform: translateY(0) rotateY(-20deg) translateZ(80px); }
      50% { transform: translateY(-10px) rotateY(-25deg) translateZ(90px); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(50%); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -8; }
    }
    
    /* Respect prefers-reduced-motion for animations */
    @media (prefers-reduced-motion: no-preference) {
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-delayed { animation: float-delayed 5s ease-in-out infinite 1s; }
      .animate-float-fast { animation: float-fast 4s ease-in-out infinite; }
      .animate-shimmer { animation: shimmer 2.5s infinite; }
      .animate-dash { animation: dash 1s linear infinite; }
    }
    
    .perspective-1000 { perspective: 1000px; }
    
    /* Form Select Customization */
    select {

<body class="bg-zinc-950 text-white antialiased selection:bg-blue-500/30 selection:text-white overflow-hidden">
  
  <!-- React Root Element -->

  <!-- React Application Code -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Menu, X, ArrowRight, Monitor, Smartphone, Zap, 
      Users, CheckCircle2, ChevronRight, Mail, Instagram, 
      MessageCircle, Code, Layers, Globe, Rocket, PenTool
    } from 'https://esm.sh/lucide-react@0.292.0';

    // --- CUSTOM HOOKS ---

    // Hook for scroll reveal animations
    const useIntersectionObserver = (options = {}) => {
      const [isIntersecting, setIsIntersecting] = useState(false);
      const elementRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsIntersecting(true);
            observer.unobserve(entry.target); // Run once
          }
        }, { threshold: 0.1, ...options });

        const currentElement = elementRef.current;
        if (currentElement) {
          observer.observe(currentElement);
        }

        return () => {
          if (currentElement) {
            observer.unobserve(currentElement);
          }
        };
      }, [options]);

      return [elementRef, isIntersecting];
    };

    // --- REUSABLE COMPONENTS ---

    const FadeIn = ({ children, delay = 0, className = "" }) => {
      const [ref, isVisible] = useIntersectionObserver();
      return (
        <div 
          ref={ref}
          className={`transition-all duration-1000 ease-out ${
            isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'
          } ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );
    };

    const SectionHeading = ({ title, subtitle, centered = false }) => (
      <div className={`mb-10 md:mb-16 ${centered ? 'text-center' : ''}`}>
        {subtitle && (
          <span className="inline-block py-1 px-3 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] md:text-xs font-semibold tracking-widest uppercase mb-4">
            {subtitle}
          </span>
        )}
        <h2 className="text-[clamp(2rem,5vw,3.5rem)] font-bold text-white tracking-tight leading-[1.15]">
          {title}
        </h2>
      </div>
    );

    // Highly accessible, fully functional universal button component
    const Button = ({ children, primary = true, className = "", href, onClick, type = "button", disabled, ...props }) => {
      const baseClass = `group relative inline-flex items-center justify-center px-6 py-3.5 md:py-3 text-sm font-medium transition-all duration-300 rounded-full overflow-hidden focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-zinc-950 disabled:opacity-50 disabled:cursor-not-allowed ${
        primary 
          ? 'text-white bg-zinc-900 border border-white/10 hover:border-white/30 hover:shadow-[0_0_20px_rgba(59,130,246,0.3)]' 
          : 'text-zinc-300 bg-transparent hover:text-white border border-zinc-800 hover:border-white/10 hover:bg-zinc-900/50'
      } ${className}`;

      const content = (
        <>
          {primary && (
            <div className="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-full pointer-events-none" />
          )}
          <span className="relative flex items-center gap-2 pointer-events-none">
            {children}
          </span>
        </>
      );

      if (href) {
        return (
          <a href={href} onClick={onClick} className={baseClass} {...props}>
            {content}
          </a>
        );
      }

      return (
        <button type={type} onClick={onClick} disabled={disabled} className={baseClass} {...props}>
          {content}
        </button>
      );
    };

    const GlassCard = ({ children, className = "" }) => (
      <div className={`bg-zinc-900/40 backdrop-blur-md border border-white/5 hover:border-white/10 rounded-[1.5rem] p-6 md:p-8 transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-blue-900/10 ${className}`}>
        {children}
      </div>
    );

    // --- MAIN SECTIONS ---

    const Navbar = ({ onNavigate }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'unset';
        }
        return () => { document.body.style.overflow = 'unset'; };
      }, [isOpen]);

      const navLinks = ['Home', 'Services', 'Portfolio', 'Process', 'About', 'Contact'];

      const handleNavClick = (e, target) => {
        e.preventDefault();
        onNavigate(target.toLowerCase());
        setIsOpen(false);
      };

      return (
        <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'bg-zinc-950/85 backdrop-blur-xl border-b border-white/5 py-4' : 'bg-transparent py-5 md:py-6'}`}>

              {isOpen ? <X className="w-6 h-6 pointer-events-none" /> : <Menu className="w-6 h-6 pointer-events-none" />}
            </button>
          </div>

          {/* Mobile Menu */}

                <a

                  style={{ transitionDelay: `${i * 50}ms` }}
                >

                </a>
              ))}
              <Button onClick={() => { onNavigate('contact'); setIsOpen(false); }} className="mt-8 w-full max-w-xs !py-4">
                Start a Project <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform pointer-events-none" />
              </Button>
            </div>
          </div>
        </nav>
      );
    };

          <div className="w-[min(100%-2rem,1500px)] mx-auto grid lg:grid-cols-2 gap-12 lg:gap-16 items-center relative z-10">

              <FadeIn>
                <div className="inline-flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-1.5 rounded-full border border-zinc-800 bg-zinc-900/50 backdrop-blur-sm mb-6 md:mb-8 pointer-events-none">
                  <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse shrink-0"></span>
                  <span className="text-[10px] md:text-xs font-medium text-zinc-300 tracking-wide uppercase">NEXT-GENERATION WEB DEVELOPMENT</span>
                </div>
              </FadeIn>
              
              <FadeIn delay={100}>
                <h1 className="text-[clamp(2.5rem,7vw,5.5rem)] font-bold text-white tracking-tight leading-[1.05] mb-6 lg:mb-8">
                  Websites Built to Make Your Business <br className="hidden lg:block xl:hidden"/>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Stand Out.</span>
                </h1>
              </FadeIn>
              
              <FadeIn delay={200}>
                <p className="text-[clamp(1rem,2vw,1.25rem)] text-zinc-400 mb-8 md:mb-10 leading-relaxed max-w-xl">
                  We design fast, modern and conversion-focused websites that turn ideas into powerful digital experiences.
                </p>
              </FadeIn>
              
              <FadeIn delay={300} className="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 mb-10 md:mb-12">

                  <span className="flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4 text-blue-500 shrink-0 sm:hidden" /> Responsive</span>

                  <span className="flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4 text-blue-500 shrink-0 sm:hidden" /> Performance</span>
                </div>
              </FadeIn>
            </div>

            {/* Abstract Futuristic Visual */}
            <div className="hidden lg:block relative h-[500px] xl:h-[600px] w-full perspective-1000 pointer-events-none">
              <FadeIn delay={300} className="absolute inset-0">
                <div className="relative w-full h-full animate-float">
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] xl:w-72 h-[360px] xl:h-96 bg-zinc-900/60 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl overflow-hidden transform rotate-y-[-10deg] rotate-x-[5deg]">
                    <div className="h-8 border-b border-white/10 flex items-center px-4 gap-1.5 bg-zinc-950/50">
                      <div className="w-2.5 h-2.5 rounded-full bg-red-500/80"></div>
                      <div className="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></div>
                      <div className="w-2.5 h-2.5 rounded-full bg-green-500/80"></div>
                    </div>
                    <div className="p-6 space-y-4">
                      <div className="h-4 w-1/3 bg-zinc-800 rounded"></div>
                      <div className="h-32 w-full bg-gradient-to-br from-blue-500/10 to-purple-600/10 rounded-lg border border-white/5 relative overflow-hidden">
                        <div className="absolute inset-0 bg-[linear-gradient(90deg,transparent_0%,rgba(255,255,255,0.05)_50%,transparent_100%)] w-[200%] animate-shimmer"></div>
                      </div>
                      <div className="space-y-2">
                        <div className="h-3 w-full bg-zinc-800/50 rounded"></div>
                        <div className="h-3 w-5/6 bg-zinc-800/50 rounded"></div>
                        <div className="h-3 w-4/6 bg-zinc-800/50 rounded"></div>
                      </div>
                    </div>
                  </div>

                  <div className="absolute top-1/4 -right-4 xl:right-4 w-48 bg-zinc-900/80 backdrop-blur-md border border-white/10 rounded-xl p-4 shadow-xl transform rotate-y-[15deg] translate-z-[50px] animate-float-delayed">
                    <div className="flex items-center gap-2 mb-3">
                      <Code className="w-4 h-4 text-blue-400 shrink-0" />
                      <span className="text-xs text-zinc-400 font-mono">index.jsx</span>
                    </div>
                    <div className="space-y-1.5">
                      <div className="h-2 w-full bg-blue-500/20 rounded"></div>
                      <div className="h-2 w-4/5 bg-purple-500/20 rounded ml-4"></div>
                      <div className="h-2 w-3/5 bg-blue-500/20 rounded ml-4"></div>
                      <div className="h-2 w-1/2 bg-zinc-800 rounded"></div>
                    </div>

                  <div className="absolute bottom-1/4 -left-4 xl:left-4 w-40 bg-zinc-900/80 backdrop-blur-md border border-white/10 rounded-xl p-4 shadow-xl transform rotate-y-[-20deg] translate-z-[80px] animate-float-fast">
                    <div className="flex items-center gap-3 mb-2">

                        <span className="text-green-400 text-xs font-bold">99</span>
                      </div>
                      <div>
                        <div className="text-xs text-white font-medium">Performance</div>

                    <defs>

                        <stop offset="0%" stopColor="#3b82f6" />

    };

    const Services = ({ onNavigate }) => {

      });
      const [status, setStatus] = useState('idle');
      const [isModalOpen, setIsModalOpen] = useState(false);

      useEffect(() => {
        if (preselectedType || prefilledMessage) {

            type: preselectedType || prev.type,
            details: prefilledMessage || prev.details
          }));
        }
      }, [preselectedType, prefilledMessage]);

      const handleChange = (e) => {

      const handleFormSubmit = (e) => {
        e.preventDefault();

      };

        setIsModalOpen(false);
        
        if (!isLegal) {
          setStatus('rejected');
          setTimeout(() => setStatus('idle'), 6000);
          return;
        }

        setStatus('submitting');
        
        try {
          const response = await fetch("https://formsubmit.co/ajax/all.in.one.hub999@gmail.com", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              _subject: "New NeXgen Web Tech Project Request — Legal Use Confirmed",
              "Client Name": formData.name,
              "Client Email": formData.email,
              "Client Phone": formData.phone || "Not provided",
              "Business / Brand Name": formData.business || "Not Provided",
              "Project Type": formData.type,
              "Estimated Budget Range": formData.budget,
              "Project Details": formData.details,
              "Legal-use confirmation": "YES",
              "Submission Date/Time": new Date().toLocaleString()
            })
          });

          if (response.ok) {
            setStatus('success');
            setFormData({ name: '', email: '', phone: '', business: '', type: '', budget: '', details: '' });
            setTimeout(() => setStatus('idle'), 5000);
          } else {
            setStatus('error');
            setTimeout(() => setStatus('idle'), 5000);
          }
        } catch (error) {
          console.error("Form submission error:", error);
          setStatus('error');
          setTimeout(() => setStatus('idle'), 5000);
        }
      };
