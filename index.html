  <!-- Custom CSS & Animations -->
  <style>
    /* Strictly prevent horizontal scrolling universally */
    html, body { 
      scroll-behavior: smooth; 
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      -webkit-font-smoothing: antialiased;
      background-color: #000000;

    /* Scrollbar styling - Black and Yellow */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000000; border-left: 1px solid rgba(255, 214, 0, 0.08); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 214, 0, 0.20); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 214, 0, 0.40); }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-10deg) rotateX(5deg); }
      50% { transform: translateY(-20px) rotate(-9deg) rotateX(10deg); }
    }
    @keyframes float-delayed {

      50% { transform: translateY(-15px) rotateY(12deg) translateZ(60px); }

      0%, 100% { transform: translateY(0) rotateY(-20deg) translateZ(80px); }
      50% { transform: translateY(-10px) rotateY(-25deg) translateZ(90px); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(50%); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -8; }

    /* Respect prefers-reduced-motion for animations */
    @media (prefers-reduced-motion: no-preference) {
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-delayed { animation: float-delayed 5s ease-in-out infinite 1s; }
      .animate-float-fast { animation: float-fast 4s ease-in-out infinite; }
      .animate-shimmer { animation: shimmer 2.5s infinite; }

<body class="bg-brand-black text-[#FFD600] antialiased selection:bg-[#FFD600]/30 selection:text-[#FFD600] overflow-hidden">
  
  <!-- React Root Element -->

  <!-- React Application Code -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Menu, X, ArrowRight, Monitor, Smartphone, Zap, 
      Users, CheckCircle2, ChevronRight, Mail, Instagram, 
      MessageCircle, Code, Layers, Globe, Rocket, PenTool
    } from 'https://esm.sh/lucide-react@0.292.0';

    // --- CUSTOM HOOKS ---

    // Hook for scroll reveal animations
    const useIntersectionObserver = (options = {}) => {
      const [isIntersecting, setIsIntersecting] = useState(false);
      const elementRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsIntersecting(true);
            observer.unobserve(entry.target); // Run once
          }
        }, { threshold: 0.1, ...options });

        const currentElement = elementRef.current;
        if (currentElement) {
          observer.observe(currentElement);
        }

        return () => {
          if (currentElement) {
            observer.unobserve(currentElement);
          }
        };
      }, [options]);

      return [elementRef, isIntersecting];
    };

    // --- REUSABLE COMPONENTS ---

    const FadeIn = ({ children, delay = 0, className = "" }) => {
      const [ref, isVisible] = useIntersectionObserver();
      return (
        <div 
          ref={ref}
          className={`transition-all duration-1000 ease-out ${
            isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'
          } ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );
    };

    const SectionHeading = ({ title, subtitle, centered = false }) => (
      <div className={`mb-10 md:mb-16 ${centered ? 'text-center' : ''}`}>
        {subtitle && (
          <span className="inline-block py-1 px-3 rounded-full bg-[#FFD600]/10 border border-[#FFD600]/[0.18] text-[#FFD600] text-[10px] md:text-xs font-semibold tracking-widest uppercase mb-4 pointer-events-none shadow-[0_0_10px_rgba(255,214,0,0.1)]">
            {subtitle}
          </span>
        )}
        <h2 className="text-[clamp(2rem,5vw,3.5rem)] font-bold text-[#FFD600] tracking-tight leading-[1.15]">
          {title}
        </h2>
      </div>
    );

    const Button = ({ children, primary = true, className = "", type = "button", disabled = false, ...props }) => (
      <button 
        type={type}
        disabled={disabled}
        className={`group relative inline-flex items-center justify-center px-6 py-3.5 md:py-3 text-sm font-bold transition-all duration-300 rounded-full overflow-hidden focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FFD600] focus-visible:ring-offset-2 focus-visible:ring-offset-[#000000] ${
          primary 
            ? 'text-black bg-[#FFD600] border border-transparent hover:bg-[#FFE44D] hover:shadow-[0_0_25px_rgba(255,214,0,0.4)]' 
            : 'text-[#FFD600] bg-transparent hover:text-[#FFE44D] border border-[#FFD600]/[0.35] hover:border-[#FFD600] hover:bg-[#FFD600]/10 hover:shadow-[0_0_15px_rgba(255,214,0,0.15)]'
        } ${disabled ? 'opacity-50 cursor-not-allowed pointer-events-none' : ''} ${className}`}
        {...props}
      >
        <span className="relative flex items-center gap-2 pointer-events-none">
          {children}
        </span>
      </button>
    );

    const GlassCard = ({ children, className = "" }) => (
      <div className={`bg-brand-card1 backdrop-blur-md border border-[#FFD600]/[0.18] hover:border-[#FFD600]/[0.35] rounded-[1.5rem] p-6 md:p-8 transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-[#FFD600]/10 ${className}`}>
        {children}
      </div>
    );

    // --- MAIN SECTIONS ---

    const Navbar = ({ scrollToSection }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Prevent background scrolling when mobile menu is open
      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = 'unset';

        return () => { document.body.style.overflow = 'unset'; };

      const navLinks = ['Home', 'Services', 'Portfolio', 'Process', 'About', 'Contact'];

      const handleNavClick = (e, link) => {
        setIsOpen(false);
        scrollToSection(e, link.toLowerCase());
      };

      return (
        <nav className={`fixed top-0 w-full z-[90] transition-all duration-300 ${scrolled ? 'bg-[#000000]/90 backdrop-blur-xl border-b border-[#FFD600]/[0.18] py-4 shadow-[0_4px_30px_rgba(0,0,0,0.8)]' : 'bg-transparent py-5 md:py-6'}`}>

                <span className="text-black font-black leading-none text-sm pointer-events-none">N</span>

            {/* Mobile Toggle */}

              onClick={() => setIsOpen(!isOpen)}
              aria-label={isOpen ? "Close Menu" : "Open Menu"}
              aria-expanded={isOpen}
            >
              {isOpen ? <X className="w-6 h-6 pointer-events-none" /> : <Menu className="w-6 h-6 pointer-events-none" />}
            </button>
          </div>

          {/* Mobile Menu */}
          <div className={`fixed inset-0 bg-[#000000]/98 backdrop-blur-2xl z-[95] transition-all duration-500 ease-in-out lg:hidden ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-full pointer-events-none'}`}>
            <div className="flex flex-col items-center justify-center h-full gap-8 px-6">
              {navLinks.map((link, i) => (
                <a 
                  key={link} 
                  href={`#${link.toLowerCase()}`} 
                  onClick={(e) => handleNavClick(e, link)}

                >
                  {link}
                </a>
              ))}

                Start a Project <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
              </Button>
            </div>
          </div>
        </nav>
      );
    };

    const Hero = ({ scrollToSection }) => {

          <div className="absolute top-1/4 right-0 lg:-right-1/4 w-[50vw] max-w-[400px] h-[50vw] max-h-[400px] bg-[#FFD600]/10 rounded-full blur-[100px] md:blur-[128px] pointer-events-none"></div>
          <div className="absolute bottom-1/4 -left-1/4 w-[50vw] max-w-[400px] h-[50vw] max-h-[400px] bg-[#FFE44D]/5 rounded-full blur-[100px] md:blur-[128px] pointer-events-none"></div>

          <div className="w-[min(100%-2rem,1500px)] mx-auto grid lg:grid-cols-2 gap-12 lg:gap-16 items-center relative z-10">
            <div className="max-w-3xl lg:max-w-2xl pt-10 lg:pt-0">
              <FadeIn>
                <div className="inline-flex items-center gap-2 px-3 py-1.5 md:px-4 md:py-1.5 rounded-full border border-[#FFD600]/[0.35] bg-brand-card2/80 backdrop-blur-sm mb-6 md:mb-8 pointer-events-none shadow-[0_0_15px_rgba(255,214,0,0.1)]">
                  <span className="w-2 h-2 rounded-full bg-[#FFD600] animate-pulse shrink-0"></span>
                  <span className="text-[10px] md:text-xs font-bold text-[#FFD600]/70 tracking-wide uppercase">NEXT-GENERATION WEB DEVELOPMENT</span>
                </div>
              </FadeIn>
              
              <FadeIn delay={100}>
                <h1 className="text-[clamp(2.5rem,7vw,5.5rem)] font-bold text-[#FFD600] tracking-tight leading-[1.05] mb-6 lg:mb-8 pointer-events-none">
                  Websites Built to Make Your Business <br className="hidden lg:block xl:hidden"/>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#FFD600] to-[#FFE44D]">Stand Out.</span>
                </h1>
              </FadeIn>
              
              <FadeIn delay={200}>
                <p className="text-[clamp(1rem,2vw,1.25rem)] text-[#FFD600]/70 mb-8 md:mb-10 leading-relaxed max-w-xl pointer-events-none">

              </FadeIn>
              
              <FadeIn delay={300} className="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 mb-10 md:mb-12">

                  <span className="flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4 text-[#FFD600] shrink-0" /> Modern Design</span>
                  <span className="hidden sm:block w-1 h-1 rounded-full bg-[#FFD600]/50"></span>
                  <span className="flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4 text-[#FFD600] shrink-0 sm:hidden" /> Responsive</span>
                  <span className="hidden sm:block w-1 h-1 rounded-full bg-[#FFD600]/50"></span>
                  <span className="flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4 text-[#FFD600] shrink-0 sm:hidden" /> Performance</span>

              <FadeIn delay={300} className="absolute inset-0">
                <div className="relative w-full h-full animate-float">
                  {/* Main Center Panel */}
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] xl:w-72 h-[360px] xl:h-96 bg-brand-card1/80 backdrop-blur-xl border border-[#FFD600]/[0.18] rounded-2xl shadow-[0_0_40px_rgba(255,214,0,0.1)] overflow-hidden transform rotate-y-[-10deg] rotate-x-[5deg]">
                    <div className="h-8 border-b border-[#FFD600]/[0.18] flex items-center px-4 gap-1.5 bg-brand-card2">
                      <div className="w-2.5 h-2.5 rounded-full bg-[#FFD600]/30"></div>
                      <div className="w-2.5 h-2.5 rounded-full bg-[#FFD600]/60"></div>
                      <div className="w-2.5 h-2.5 rounded-full bg-[#FFD600]"></div>
                    </div>
                    <div className="p-6 space-y-4">
                      <div className="h-4 w-1/3 bg-[#FFD600]/20 rounded"></div>
                      <div className="h-32 w-full bg-gradient-to-br from-[#FFD600]/10 to-transparent rounded-lg border border-[#FFD600]/[0.18] relative overflow-hidden">
                        <div className="absolute inset-0 bg-[linear-gradient(90deg,transparent_0%,rgba(255,214,0,0.1)_50%,transparent_100%)] w-[200%] animate-shimmer"></div>
                      </div>
                      <div className="space-y-2">
                        <div className="h-3 w-full bg-[#FFD600]/10 rounded"></div>
                        <div className="h-3 w-5/6 bg-[#FFD600]/10 rounded"></div>
                        <div className="h-3 w-4/6 bg-[#FFD600]/10 rounded"></div>
                      </div>
                    </div>
                  </div>

                  {/* Floating Element 1 (Code) */}
                  <div className="absolute top-1/4 -right-4 xl:right-4 w-48 bg-brand-card1/90 backdrop-blur-md border border-[#FFD600]/[0.18] rounded-xl p-4 shadow-[0_0_30px_rgba(255,214,0,0.15)] transform rotate-y-[15deg] translate-z-[50px] animate-float-delayed">

                      <div className="h-2 w-3/5 bg-[#FFD600]/20 rounded ml-4"></div>
                      <div className="h-2 w-1/2 bg-[#FFD600]/30 rounded"></div>

                    <div className="flex items-center gap-3 mb-2">
                      <div className="w-8 h-8 rounded-full bg-[#FFD600]/20 flex items-center justify-center shrink-0 border border-[#FFD600]/[0.18]">
                        <span className="text-[#FFD600] text-xs font-bold">99</span>
                      </div>

                        <stop offset="100%" stopColor="#FFD600" stopOpacity="1" />

                  </svg>
                </div>
              </FadeIn>
            </div>
          </div>
        </section>
      );
    };

    const Services = ({ scrollToSection }) => {
      const plans = [
        {
          num: "01",

        {
